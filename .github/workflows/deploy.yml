name: Deploy frontend

# Builds the Next.js app IN CI (GitHub runner has ample RAM), then ships only
# the compiled standalone bundle to the server — no source, no build on the VPS.
# The server builds a thin runtime image (COPY + node server.js) and restarts.
#
# Required repo secrets: SSH_HOST, SSH_USER, SSH_KEY (private key).
# After cutover, drop `v2-directus` from the branch list so only main deploys.

on:
  push:
    branches: [main, v2-directus]
    paths-ignore:
      - "scripts/**"
      - "directus/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Assemble standalone bundle
        run: |
          rm -rf dist && mkdir -p dist/.next
          cp -r .next/standalone/. dist/
          cp -r .next/static dist/.next/static
          cp -r public dist/public
          cp deploy/frontend/Dockerfile dist/Dockerfile
          cp deploy/frontend/docker-compose.yml dist/docker-compose.yml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync bundle to server
        run: |
          rsync -az --delete --exclude '.env' \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/apps/reca/frontend/"

      - name: Build runtime image & restart
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd /srv/apps/reca/frontend && docker compose up -d --build && docker image prune -f'
