# Frontend app stack on the server (/srv/apps/reca/frontend/).
# The build context is the CI-assembled standalone bundle synced next to this
# file — the server only builds a thin runtime image (COPY + run), no source.
#
# Runtime secrets come from ./.env (created once on the server, NOT in git):
#   DIRECTUS_INTERNAL_URL=http://directus:8055
#   DIRECTUS_SERVICE_TOKEN=<website service token>
#   NEXT_PUBLIC_SITE_URL=https://reca.kz

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reca-app
    restart: unless-stopped
    env_file: .env
    networks:
      - reca-network

networks:
  reca-network:
    external: true
